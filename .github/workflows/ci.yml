name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      - name: Check distribution contents
        run: |
          python - <<'EOF'
          import glob
          import sys
          import tarfile
          import zipfile

          from gosent.core import VERSION

          (wheel,) = glob.glob("dist/*.whl")
          (sdist,) = glob.glob("dist/*.tar.gz")

          info = "gosent-{0}.dist-info".format(VERSION)
          expected_wheel = {
              "gosent/__init__.py",
              "gosent/client.py",
              "gosent/core.py",
              info + "/METADATA",
              info + "/WHEEL",
              info + "/RECORD",
              info + "/licenses/LICENSE",
          }
          root = "gosent-{0}/".format(VERSION)
          expected_sdist = {
              root + name
              for name in (
                  ".gitignore",
                  "CHANGELOG.md",
                  "LICENSE",
                  "PKG-INFO",
                  "README.md",
                  "pyproject.toml",
                  "gosent/__init__.py",
                  "gosent/client.py",
                  "gosent/core.py",
                  "tests/test_client.py",
              )
          }

          with zipfile.ZipFile(wheel) as zf:
              got_wheel = set(zf.namelist())
          with tarfile.open(sdist) as tf:
              got_sdist = {m.name for m in tf.getmembers() if not m.isdir()}

          ok = True
          for label, got, expected in (
              (wheel, got_wheel, expected_wheel),
              (sdist, got_sdist, expected_sdist),
          ):
              print(label)
              for name in sorted(got):
                  print("  " + name)
              extra, missing = got - expected, expected - got
              if extra or missing:
                  ok = False
                  print("::error::{0}: unexpected {1}, missing {2}".format(
                      label, sorted(extra), sorted(missing)))
          sys.exit(0 if ok else 1)
          EOF

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: Test wheel (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Install the wheel
        run: python -m pip install dist/*.whl

      - name: Run unit tests against the installed wheel
        run: |
          # Run from a copy of tests/ outside the checkout so that `import gosent`
          # resolves to the installed wheel and not to the ./gosent source tree.
          mkdir -p "$RUNNER_TEMP/wheel-test"
          cp -r tests "$RUNNER_TEMP/wheel-test/"
          cd "$RUNNER_TEMP/wheel-test"
          python -c "import gosent; print(gosent.__version__, gosent.__file__); assert 'site-packages' in gosent.__file__"
          python -m unittest discover -s tests
