name: Release

# Publishes gosent to PyPI when a version tag such as v0.1.0 is pushed.
# The tag must equal "v" + gosent.core.VERSION, otherwise nothing is built.
#
# Today the upload authenticates with the PYPI_TOKEN secret. To switch to PyPI
# Trusted Publishing later:
#   1. On pypi.org, add a trusted publisher (GitHub) for the gosent project with
#      owner sadewadee, repository gosent-python, workflow release.yml and
#      environment pypi.
#   2. Delete the `password:` line in the "Publish to PyPI" step below. The action
#      then uses the job's OIDC token (id-token: write is already granted).
#   3. Remove the PYPI_TOKEN secret from GitHub and revoke the token on pypi.org.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check that the tag matches gosent.core.VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c 'from gosent.core import VERSION; print(VERSION)')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match v$version from gosent/core.py"
            exit 1
          fi

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      - name: Install the wheel
        run: python -m pip install dist/*.whl

      - name: Run unit tests against the installed wheel
        run: |
          # Run from a copy of tests/ outside the checkout so that `import gosent`
          # resolves to the installed wheel and not to the ./gosent source tree.
          mkdir -p "$RUNNER_TEMP/wheel-test"
          cp -r tests "$RUNNER_TEMP/wheel-test/"
          cd "$RUNNER_TEMP/wheel-test"
          python -c "import gosent; print(gosent.__version__, gosent.__file__); assert 'site-packages' in gosent.__file__"
          python -m unittest discover -s tests

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gosent/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Delete this line after setting up Trusted Publishing (see the top of this file).
          password: ${{ secrets.PYPI_TOKEN }}
